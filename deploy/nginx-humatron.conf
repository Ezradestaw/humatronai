# ==============================================================================
# Nginx Configuration for Humatron Telegram Webhook & Companion API
# Place in /etc/nginx/sites-available/humatron and symlink to sites-enabled
# ==============================================================================

server {
    listen 80;
    server_name api.humatron.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.humatron.me;

    # SSL Certificates (managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api.humatron.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.humatron.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum upload size for PDF files (matches MAX_PDF_SIZE_MB)
    client_max_body_size 25M;

    # Rate limiting for webhook and API endpoints
    limit_req_zone $binary_remote_addr zone=humatron_limit:10m rate=15r/s;

    location / {
        limit_req zone=humatron_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for document processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
