services:
  - type: web
    name: humatron-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: humatron-db
          property: connectionString
      - key: HUMATRON_API_BASE_URL
        value: https://humatron.me
      - key: HUMATRON_SECRET_KEY
        generateValue: true

databases:
  - name: humatron-db
    databaseName: humatron_db
    user: humatron
    plan: free
